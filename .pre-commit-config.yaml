repos:
  - repo: local
    hooks:
      - id: verificar-codigo
        name: Verificar código Python
        entry: uv run --frozen ruff check
        language: system
        types: [python]
      - id: verificar-formatacao
        name: Verificar formatação Python
        entry: uv run --frozen ruff format --check
        language: system
        types: [python]
      - id: verificar-tipos
        name: Verificar tipos da aplicação
        entry: uv run --frozen mypy src
        language: system
        pass_filenames: false
        types: [python]
