global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alertas.yaml
scrape_configs:
  - job_name: api_local
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: [api_local:8000]
  - job_name: prometheus_local
    static_configs:
      - targets: [localhost:9090]
